version: '3.9'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: app-api-prod
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    container_name: app-web-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped