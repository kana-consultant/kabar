version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-staging
    env_file:
      - ../apps/api/.env.staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-staging

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-staging
    env_file:
      - ../apps/api/.env.staging
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-staging

  api:
    image: ghcr.io/dewo1357/kabar-api:staging
    build:
      context: ../apps/api
    container_name: kabar-api-staging
    env_file:
      - ../apps/api/.env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kabar-staging

  web:
    image: ghcr.io/dewo1357/kabar-web:staging
    build:
      context: ../apps/web
      args:
        VITE_API_URL: /api
    container_name: kabar-web-staging
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - kabar-staging

  nginx:
    image: nginx:alpine
    container_name: kabar-nginx-staging
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_staging_logs:/var/log/nginx
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - kabar-staging

volumes:
  postgres_staging_data:
  nginx_staging_logs:

networks:
  kabar-staging:
    driver: bridge