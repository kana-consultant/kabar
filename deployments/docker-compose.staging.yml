version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-staging
    env_file:
      - ../apps/api/.env.staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-staging

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-staging
    env_file:
      - ../apps/api/.env.staging
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-staging

  kabar-api:
    image: ghcr.io/kana-consultant/kabar-api:staging
    # HAPUS container_name, biarkan docker compose yang buat
    # container_name: kabar-api-staging  ← HAPUS INI
    env_file:
      - ../apps/api/.env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kabar-staging
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  kabar-web:
    image: ghcr.io/kana-consultant/kabar-web:staging
    # HAPUS container_name: kabar-web-staging  ← HAPUS INI
    depends_on:
      - kabar-api
    restart: unless-stopped
    networks:
      - kabar-staging
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: kabar-nginx-staging
    depends_on:
      - kabar-api
      - kabar-web
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - kabar-staging

volumes:
  postgres_staging_data:

networks:
  kabar-staging:
    driver: bridge