version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-production
    env_file:
      - ../apps/api/.env.production
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-production

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-production
    env_file:
      - ../apps/api/.env.production
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-production

  kabar-api:
    image: ${API_IMAGE_TAG:-ghcr.io/kana-consultant/kabar-api:latest}  # ← PASTIKAN INI
    container_name: kabar-api-production
    env_file:
      - ../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kabar-production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  kabar-web:
    image: ${WEB_IMAGE_TAG:-ghcr.io/kana-consultant/kabar-web:latest}  # ← PASTIKAN INI
    container_name: kabar-web-production
    depends_on:
      - kabar-api
    restart: unless-stopped
    networks:
      - kabar-production
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: kabar-nginx-production
    depends_on:
      - kabar-api
      - kabar-web
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - kabar-production

volumes:
  postgres_production_data:

networks:
  kabar-production:
    driver: bridge