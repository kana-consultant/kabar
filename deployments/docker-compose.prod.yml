version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-prod
    env_file:
      - ../apps/api/.env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-internal

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-internal

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: kabar-api-prod
    env_file:
      - ../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kabar-internal

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: kabar-web-prod
    depends_on:
      - api
    restart: always
    networks:
      - kabar-internal

  nginx:
    image: nginx:alpine
    container_name: kabar-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    restart: always
    networks:
      - kabar-internal

volumes:
  postgres_prod_data:
  nginx_logs:

networks:
  kabar-internal:
    driver: bridge