version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kabar_database}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kabar-network

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-prod
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kabar-network

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    container_name: kabar-api-prod
    environment:
      - APP_BASE_URL=${APP_BASE_URL:-https://yourdomain.com}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-kabar_database}
      - DB_SSL_MODE=disable
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=24
      - SERVER_PORT=8080
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_SECURE=false
      - SMTP_TLS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GO_ENV=production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kabar-network

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.yourdomain.com/api/}
    container_name: kabar-web-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    networks:
      - kabar-network

networks:
  kabar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: