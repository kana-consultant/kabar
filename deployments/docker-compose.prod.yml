version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabar-postgres-production
    env_file:
      - ../apps/api/.env.production
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-production

  redis:
    image: redis:7-alpine
    container_name: kabar-redis-production
    env_file:
      - ../apps/api/.env.production
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kabar-production

  api:
    image: ghcr.io/kana-consultant/kabar-api:latest
    container_name: kabar-api-production
    env_file:
      - ../apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kabar-production

  web:
    image: ghcr.io/kana-consultant/kabar-web:latest
    build:
      context: ../apps/web
      args:
        VITE_API_URL: /api
    container_name: kabar-web-production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - kabar-production

  nginx:
    image: nginx:alpine
    container_name: kabar-nginx-production
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_production_logs:/var/log/nginx
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - kabar-production

volumes:
  postgres_production_data:
  nginx_production_logs:

networks:
  kabar-production:
    driver: bridge