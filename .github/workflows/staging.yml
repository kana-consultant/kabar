name: Staging Pipeline

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging-${{ github.sha }}
            ${{ env.API_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:staging
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e

            cd /home/deployer/projects/kabar

            # Create backup directory for staging
            mkdir -p /home/deployer/backups/kabar-staging
            BACKUP_FILE="/home/deployer/backups/kabar-staging/backup_$(date +%Y%m%d_%H%M%S).sql"

            # Backup staging database if exists
            echo "📦 Creating staging database backup..."
            if docker ps 2>/dev/null | grep "kabar-postgres-staging" >/dev/null 2>&1; then
              docker exec kabar-postgres-staging pg_dump -U ${DB_USER:-kabar} ${DB_NAME:-kabar_staging} > "$BACKUP_FILE" 2>/dev/null || echo "⚠️ Backup failed"
              gzip "$BACKUP_FILE" 2>/dev/null || true
              echo "✅ Backup created: $(basename $BACKUP_FILE.gz)"
              find /home/deployer/backups/kabar-staging -name "backup_*.sql.gz" -mtime +3 -delete
            else
              echo "ℹ️ Database not running, skipping backup"
            fi

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null

            # Pull latest staging images
            echo "🔄 Pulling staging images..."
            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.staging.yml pull

            # Restart containers
            echo "🚀 Restarting staging containers..."
            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.staging.yml up -d

            # Wait for containers to be ready
            echo "⏳ Waiting for containers to be ready..."
            sleep 15

            # Health check via nginx (port 8081)
            echo "🏥 Running staging health checks..."
            HEALTH_CHECK_PASSED=false
            
            for i in 1 2 3 4 5; do
              echo "Health check attempt $i/5..."
              
              # Try various endpoints via nginx port 8081
              if curl -f http://localhost:8081/health 2>/dev/null || \
                 curl -f http://localhost:8081/api/health 2>/dev/null || \
                 curl -f http://localhost:8081/ 2>/dev/null | grep -q "healthy\|ok\|up" 2>/dev/null; then
                HEALTH_CHECK_PASSED=true
                echo "✅ Health check passed!"
                break
              fi
              
              sleep 5
            done

            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "⚠️ Staging health check failed!"
              echo "Container logs for debugging:"
              COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
              docker compose -f deployments/docker-compose.staging.yml logs --tail=50 kabar-api
              # Don't exit with error for staging, just warn
            else
              echo "✅ Staging deployment successful!"
            fi

            # Show running containers
            echo ""
            echo "📋 Running containers:"
            docker ps --filter "name=kabar-staging" --format "table {{.Names}}\t{{.Status}}"

            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Keep only last 10 staging images
            docker images ghcr.io/kana-consultant/kabar-api --format "{{.Tag}}" | grep "staging-" | sort -r | tail -n +11 | xargs -r docker rmi 2>/dev/null || true
            docker images ghcr.io/kana-consultant/kabar-web --format "{{.Tag}}" | grep "staging-" | sort -r | tail -n +11 | xargs -r docker rmi 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "✅ Staging Deployment Complete!"
            echo "=========================================="
            echo "🌐 Access: http://${{ secrets.SERVER_HOST }}:8081"
            echo "📦 API Image: ${{ env.API_IMAGE }}:staging-${{ github.sha }}"
            echo "🌐 Web Image: ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}"
            echo "💾 Backup: $(basename $BACKUP_FILE.gz)"
            echo "=========================================="