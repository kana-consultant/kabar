name: Staging Pipeline

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging-${{ github.sha }}
            ${{ env.API_IMAGE }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:staging-latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e

            cd /home/deployer/projects/kabar

            # Backup staging database
            mkdir -p /home/deployer/backups/kabar-staging
            BACKUP_FILE="/home/deployer/backups/kabar-staging/backup_$(date +%Y%m%d_%H%M%S).sql"

            if docker ps | grep -q "${COMPOSE_PROJECT_NAME}-postgres"; then
              docker exec ${COMPOSE_PROJECT_NAME}-postgres-1 pg_dump -U ${DB_USER:-kabar} ${DB_NAME:-kabar_staging} > "$BACKUP_FILE" 2>/dev/null || true
              gzip "$BACKUP_FILE" 2>/dev/null || true
              find /home/deployer/backups/kabar-staging -name "backup_*.sql.gz" -mtime +3 -delete
            fi

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Deploy
            export API_IMAGE_TAG=${{ env.API_IMAGE }}:staging-${{ github.sha }}
            export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:staging-${{ github.sha }}

            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.staging.yml pull

            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.staging.yml up -d

            # Health check
            sleep 10
            curl -f http://localhost:8081/health || echo "Health check warning"

            docker image prune -f