- name: Deploy ke Staging
  uses: appleboy/ssh-action@v1.2.0
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: ${{ secrets.SERVER_PORT }}
    script_stop: false
    script: |
      cd /home/deployer/projects/kabar || exit 1
      
      echo "=========================================="
      echo "Starting deployment to STAGING"
      echo "=========================================="
      
      # Login to GHCR
      echo "🔐 Logging into GHCR..."
      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      # Set image tags
      export API_IMAGE_TAG=${{ env.API_IMAGE }}:staging-${{ github.sha }}
      export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
      
      echo "📦 API Image: $API_IMAGE_TAG"
      echo "📦 Web Image: $WEB_IMAGE_TAG"
      
      # Stop and remove old containers (FORCE for staging)
      echo "🛑 Stopping and removing old containers..."
      docker compose -f deployments/docker-compose.staging.yml down
      
      # Pull fresh images
      echo "🔄 Pulling fresh images..."
      docker compose -f deployments/docker-compose.staging.yml pull
      
      # Start with new images
      echo "🚀 Starting new containers..."
      docker compose -f deployments/docker-compose.staging.yml up -d
      
      # Wait and health check
      sleep 15
      
      # Health check
      if curl -f http://localhost:8081/health; then
        echo "✅ Health check passed!"
      else
        echo "⚠️ Health check failed, but staging continues"
      fi
      
      echo "✅ STAGING DEPLOYMENT COMPLETE!"