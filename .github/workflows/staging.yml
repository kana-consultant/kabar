name: Staging Pipeline

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:staging
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: false
          script: |
            cd /home/deployer/projects/kabar || exit 1

            echo "=========================================="
            echo "Starting deployment to STAGING"
            echo "=========================================="

            # Login GHCR
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull image dengan sha spesifik
            echo "🔄 Pulling images..."
            docker pull ${{ env.API_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.WEB_IMAGE }}:${{ github.sha }}

            # Deploy
            echo "🚀 Restarting containers..."
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f deployments/docker-compose.staging.yml up -d --force-recreate

            # Health check
            echo "🏥 Health check..."
            sleep 15
            if curl -f http://localhost:8081/health; then
              echo "✅ Health check passed!"
            else
              echo "⚠️ Health check warning (staging continues)"
            fi

            # Verifikasi file JS terbaru
            echo "🔍 Verifying web files..."
            docker exec kabar-staging-kabar-web-1 sh -c "ls -la /usr/share/nginx/html/assets/" 2>/dev/null || echo "Cannot list files"

            # Cleanup
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "✅ STAGING DEPLOYMENT SUCCESSFUL!"
            echo "=========================================="
            echo "🌐 URL: http://${{ secrets.SERVER_HOST }}:8081"
            echo "🖼️  API Image: ${{ env.API_IMAGE }}:${{ github.sha }}"
            echo "🎨 Web Image: ${{ env.WEB_IMAGE }}:${{ github.sha }}"
            echo "=========================================="