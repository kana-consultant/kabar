name: Staging Pipeline

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging-${{ github.sha }}

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd /home/deployer/projects/kabar

            # ❌ HAPUS OVERWRITE ENV TIAP DEPLOY
            # ENV HARUS STAY DI SERVER

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            export API_IMAGE_TAG=${{ env.API_IMAGE }}:staging-${{ github.sha }}
            export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:staging-${{ github.sha }}

            docker compose -f deployments/docker-compose.staging.yml pull
            docker compose -f deployments/docker-compose.staging.yml up -d

            docker image prune -f