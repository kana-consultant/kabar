name: Production Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: false
          script: |
            cd /home/deployer/projects/kabar || exit 1
            
            echo "=========================================="
            echo "Starting deployment to PRODUCTION"
            echo "=========================================="
            
            # Create backup directory
            mkdir -p /home/deployer/backups/kabar
            
            # Backup database (with error handling)
            echo "📦 Creating database backup..."
            BACKUP_FILE="/home/deployer/backups/kabar/backup_$(date +%Y%m%d_%H%M%S).sql"
            
            # Check if postgres container is running
            if docker ps --format '{{.Names}}' | grep -q "kabar-postgres-production"; then
              echo "Postgres container found, creating backup..."
              docker exec kabar-postgres-production pg_dump -U kabar kabar > "$BACKUP_FILE" 2>/dev/null && {
                gzip "$BACKUP_FILE"
                echo "✅ Backup created: $(basename $BACKUP_FILE.gz)"
                # Clean old backups
                find /home/deployer/backups/kabar -name "backup_*.sql.gz" -mtime +7 -delete
              } || {
                echo "⚠️ Backup failed, continuing anyway..."
                rm -f "$BACKUP_FILE"
              }
            else
              echo "ℹ️ Postgres container not running, skipping backup"
            fi
            
            # Login to GHCR
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Set image tags
            export API_IMAGE_TAG=${{ env.API_IMAGE }}:${{ github.sha }}
            export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:${{ github.sha }}
            
            echo "📦 API Image: $API_IMAGE_TAG"
            echo "📦 Web Image: $WEB_IMAGE_TAG"
            
            # Pull new images
            echo "🔄 Pulling new images..."
            docker compose -f deployments/docker-compose.prod.yml pull
            
            # Stop old containers gracefully
            echo "🛑 Stopping old containers..."
            docker compose -f deployments/docker-compose.prod.yml stop kabar-api kabar-web || true
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose -f deployments/docker-compose.prod.yml up -d
            
            # Wait for containers to be ready
            echo "⏳ Waiting for containers to be ready (20s)..."
            sleep 20
            
            # Health check
            echo "🏥 Running health checks..."
            HEALTH_CHECK_PASSED=false
            MAX_RETRIES=10
            RETRY=0
            
            while [ $RETRY -lt $MAX_RETRIES ]; do
              RETRY=$((RETRY + 1))
              echo "Health check attempt $RETRY/$MAX_RETRIES..."
              
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health 2>/dev/null || echo "000")
              
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
                HEALTH_CHECK_PASSED=true
                echo "✅ Health check passed! (HTTP $HTTP_CODE)"
                break
              fi
              
              echo "   Got HTTP $HTTP_CODE, retrying in 5s..."
              sleep 5
            done
            
            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "❌ Health check FAILED after $MAX_RETRIES attempts!"
              echo ""
              echo "📋 Container status:"
              docker ps -a --filter "name=kabar"
              echo ""
              echo "📋 API logs (last 30 lines):"
              docker compose -f deployments/docker-compose.prod.yml logs --tail=30 kabar-api
              echo ""
              echo "📋 Nginx logs:"
              docker logs kabar-nginx-production --tail=20 2>/dev/null || echo "Nginx container not found"
              exit 1
            fi
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo ""
            echo "=========================================="
            echo "✅ DEPLOYMENT SUCCESSFUL!"
            echo "=========================================="
            echo "🌐 URL: http://${{ secrets.SERVER_HOST }}:8001"
            echo "🖼️  API Image: $API_IMAGE_TAG"
            echo "🎨 Web Image: $WEB_IMAGE_TAG"
            echo "=========================================="