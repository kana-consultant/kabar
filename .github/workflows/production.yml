name: Production Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e

            cd /home/deployer/projects/kabar

            # Create backup directory
            mkdir -p /home/deployer/backups/kabar
            BACKUP_FILE="/home/deployer/backups/kabar/backup_$(date +%Y%m%d_%H%M%S).sql"

            # Backup database if exists
            echo "📦 Creating database backup..."
            if docker ps 2>/dev/null | grep "${COMPOSE_PROJECT_NAME}-postgres" >/dev/null 2>&1; then
              docker exec ${COMPOSE_PROJECT_NAME}-postgres-1 pg_dump -U ${DB_USER:-kabar} ${DB_NAME:-kabar} > "$BACKUP_FILE" 2>/dev/null || echo "⚠️ Backup failed"
              gzip "$BACKUP_FILE" 2>/dev/null || true
              echo "✅ Backup created"
              find /home/deployer/backups/kabar -name "backup_*.sql.gz" -mtime +7 -delete
            else
              echo "ℹ️ Database not running, skipping backup"
            fi

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null

            # Deploy dengan image tag dari build
            export API_IMAGE_TAG=${{ env.API_IMAGE }}:${{ github.sha }}
            export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:${{ github.sha }}

            # Pull images
            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.prod.yml pull

            # Restart containers
            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
            docker compose -f deployments/docker-compose.prod.yml up -d

            # Wait for containers ready
            echo "Waiting for containers to be ready..."
            sleep 15

            # Health check via nginx (port 8001)
            echo "🏥 Running health checks..."
            HEALTH_CHECK_PASSED=false
            
            for i in 1 2 3 4 5; do
              echo "Health check attempt $i/5..."
              
              # Coba berbagai endpoint yang mungkin
              if curl -f http://localhost:8001/health 2>/dev/null || \
                 curl -f http://localhost:8001/api/health 2>/dev/null; then
                HEALTH_CHECK_PASSED=true
                echo "✅ Health check passed!"
                break
              fi
              
              sleep 5
            done

            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "❌ Health check failed!"
              echo "Container logs:"
              COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} \
              docker compose -f deployments/docker-compose.prod.yml logs --tail=50 kabar-api
              exit 1
            fi

            echo "✅ Deployment successful!"

            # Cleanup old images
            docker image prune -f