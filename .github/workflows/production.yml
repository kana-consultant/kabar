name: Production Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/kana-consultant/kabar-api
  WEB_IMAGE: ghcr.io/kana-consultant/kabar-web
  COMPOSE_PROJECT_NAME: kabar-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download
          go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy ke Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: false
          script: |
            cd /home/deployer/projects/kabar || exit 1
            
            echo "=========================================="
            echo "Starting deployment to PRODUCTION"
            echo "=========================================="
            
            # Create backup directory
            mkdir -p /home/deployer/backups/kabar
            BACKUP_FILE="/home/deployer/backups/kabar/backup_$(date +%Y%m%d_%H%M%S).sql"
            
            # Backup database
            echo "📦 Creating database backup..."
            if docker ps --format '{{.Names}}' | grep -q "kabar-postgres-production"; then
              docker exec kabar-postgres-production pg_dump -U kabar kabar > "$BACKUP_FILE" 2>/dev/null && {
                gzip "$BACKUP_FILE"
                echo "✅ Backup created"
                find /home/deployer/backups/kabar -name "backup_*.sql.gz" -mtime +7 -delete
              }
            fi
            
            # Login GHCR
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Hardcode image tags
            export API_IMAGE_TAG=${{ env.API_IMAGE }}:latest
            export WEB_IMAGE_TAG=${{ env.WEB_IMAGE }}:latest
            
            echo "📦 API Image: $API_IMAGE_TAG"
            echo "📦 Web Image: $WEB_IMAGE_TAG"
            
            # Pull and restart
            docker compose -f deployments/docker-compose.prod.yml pull
            docker compose -f deployments/docker-compose.prod.yml up -d --force-recreate
            
            # Health check
            sleep 15
            if curl -f http://localhost:8001/health; then
              echo "✅ Health check passed!"
            else
              echo "❌ Health check failed!"
              exit 1
            fi
            
            # Cleanup
            docker image prune -f
            
            echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL!"